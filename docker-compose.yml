services:
  api:
    build: .
    container_name: parku-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Todas las variables (BD, JWT, correo, rate limiting...) salen de .env -- ver
    # .env.example para la lista completa. Con esto una variable nueva que se agregue al
    # proyecto no requiere tocar este archivo también.
    env_file:
      - .env
    environment:
      - PORT=3000
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - parku-network

networks:
  parku-network:
    name: parku-network
